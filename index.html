<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>proftest</title>
  <link rel="icon" type="image/jpeg" href="logoprofkom.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Marck+Script&family=Rubik:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="app" id="appTop">
    <header class="app-header">
      <img src="logoprofkom.jpg" alt="Логотип" class="logo-img">
      <div>
        <p class="eyebrow">Тренажер профтеста</p>
        <h1>proftest</h1>
      </div>
    </header>

    <nav class="icon-nav" aria-label="Разделы">
      <button class="nav-icon active" type="button" data-tab="info" aria-label="Информация">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
      </button>
      <button class="nav-icon" type="button" data-tab="faces" aria-label="Лица профсоюза">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg>
      </button>
      <button class="nav-icon" type="button" data-tab="questions" aria-label="Вопросы">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 015.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg>
      </button>
      <button class="nav-icon" type="button" data-tab="test" aria-label="Тест">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M9 12l2 2 4-4"/></svg>
      </button>
      <button class="nav-icon" type="button" data-tab="biathlon" aria-label="Биатлон">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><polyline points="12,6 12,12 16,14"/></svg>
      </button>
    </nav>

    <section id="tab-info" class="tab-content active">
      <h2>Общая информация</h2>
      <div class="card">
        <p id="projectDescription">Загружаю банк вопросов...</p>
        <p class="muted" id="loadStatus"></p>
      </div>
    </section>

    <section id="tab-faces" class="tab-content">
      <h2>Лица Профсоюза</h2>
      <div class="card">
        <div id="facesContainer" class="faces-grid"></div>
      </div>
    </section>

    <section id="tab-questions" class="tab-content">
      <h2>Вопросы</h2>
      <p id="questionsCount" class="section-note"></p>
      <div id="questionGroups"></div>
    </section>

    <section id="tab-test" class="tab-content">
      <h2>Тест</h2>
      <div class="test-mode-selector">
        <label><input type="radio" name="testMode" value="mixed" checked> Смешанный</label>
        <label><input type="radio" name="testMode" value="closed"> Только с выбором</label>
        <label><input type="radio" name="testMode" value="open"> Только открытые</label>
        <span class="selector-divider" aria-hidden="true"></span>
        <label><input type="radio" name="questionCount" value="20" checked> 20 вопросов</label>
        <label><input type="radio" name="questionCount" value="50"> 50 вопросов</label>
      </div>
      <div class="card centered" id="start-card">
        <p class="start-card-text">Выберите режим и количество вопросов, затем запустите генерацию.</p>
        <button id="start-test-btn" type="button">Сгенерировать тест</button>
      </div>
      <div id="timer-container" class="timer-container">
        <span>Осталось:</span>
        <span id="timer-display">20:00</span>
      </div>
      <div id="test-questions-area" hidden></div>
      <div id="test-result-area" hidden></div>
      <div id="test-actions" class="flex-row" hidden>
        <button id="submit-test-btn" type="button">Завершить тест</button>
        <button id="reset-test-btn" type="button" class="secondary">Новый тест</button>
        <button id="export-word-btn" type="button" class="secondary">Скачать в Word</button>
      </div>
    </section>

    <section id="tab-biathlon" class="tab-content">
      <h2>Биатлон</h2>
      <div class="card centered" id="biathlon-start-card">
        <p class="biathlon-start-text">Отвечайте на открытые вопросы. На каждый вопрос дается 20 секунд. Игра идет до первой ошибки.</p>
        <button id="start-biathlon-btn" type="button">Начать биатлон</button>
      </div>
      <div id="biathlon-game-area" hidden>
        <div class="biathlon-timer" id="biathlon-timer">20</div>
        <div class="question-block" id="biathlon-question-text"></div>
        <input type="text" id="biathlon-answer-input" class="biathlon-input" placeholder="Ваш ответ">
        <button id="biathlon-submit-btn" type="button">Ответить</button>
      </div>
      <div id="biathlon-result-area" hidden></div>
    </section>
  </main>

  <button class="scroll-to-top" id="scrollToTopBtn" type="button" aria-label="Наверх">↑</button>
</body>
</html>
